# This is a standard pFind configure file
# For help: mail to chihao@ict.ac.cn
# Time: 2026/8/20 17:25:54

[Version]
pFind_Version=EVA.3.2.2

[param]
thread=20
activation_type=HCD-FTMS
mstol=20
mstolppm=1
msmstol=20
msmstolppm=1
temppepnum=100
pepnum=10
selectpeak=200
maxprolen=60000000
maxspec=100000
IeqL=1
npep=2
maxdelta=500
selectmod=Oxidation[M];Deamidated[N];Cation_Na[D];Cation_Na[E];Deamidated[Q];Acetyl[AnyN-term];Carbamidomethyl[AnyN-term];Cation_Na[AnyC-term];Gln->pyro-Glu[AnyN-termQ];Glu->pyro-Glu[AnyN-termE];
fixmod=Carbamidomethyl[C];Formyl[AnyN-term];
maxmod=2
enzyme=Trypsin KR P C
digest=1
max_clv_sites=3

[filter]
psm_fdr=0.01
psm_fdr_type=1
mass_lower=600
mass_upper=10000
len_lower=6
len_upper=100
pep_per_pro=1
pro_fdr=0.01

[engine]
open=0
open_tag_len=5

rest_tag_iteration=1
rest_tag_len=4
rest_mod_num=10

salvo_iteration=1
salvo_mod_num=5

[file]
modpath=__REWRITTEN_BY_isoPSV__
fastapath=__FASTAPATH__
outputpath=__OUTPUTPATH__
outputname=__OUTPUTNAME__

[datalist]
msmsnum=__MSMSNUM__
msmspath1=__MSMSPATH__
msmstype=MGF

[quant]
quant=1|None

[system]
log=LOG_INFO
